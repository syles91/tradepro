<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e11">
<title>TradePro — offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0e11; color: #d1d4dc;
    font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
    display: grid; place-items: center; padding: 24px;
  }
  .card {
    max-width: 420px; text-align: center;
    background: #131722; border: 1px solid #232838;
    border-radius: 18px; padding: 32px 26px;
  }
  img { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 18px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p  { margin: 0 0 22px; color: #787b86; line-height: 1.5; font-size: 14px; }
  button {
    border: 0; border-radius: 10px; padding: 13px 26px;
    background: #2962ff; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
  }
</style>
</head>
<body>
<main class="card">
  <img src="/static/icons/icon-192.png" alt="TradePro">
  <h1>Keine Verbindung</h1>
  <p>TradePro erreicht den Server gerade nicht. Prüfe dein Netzwerk oder ob das Terminal läuft.</p>
  <button onclick="location.replace('/')">Erneut versuchen</button>
</main>
<script>
  window.addEventListener('online', () => location.replace('/'));
</script>
</body>
</html>
